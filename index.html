<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voidforged</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{font-family:'Space Grotesk',sans-serif;background:#080808}
.mono{font-family:'JetBrains Mono',monospace}
</style>
</head>
<body class="text-white min-h-screen">
<!-- HEADER CLEAN -->
<nav class="border-b border-zinc-800/60 bg-black/80 backdrop-blur sticky top-0 z-50">
<div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-9 h-9 bg-white text-black rounded-lg flex items-center justify-center font-bold text-lg">V</div>
<span class="font-bold tracking-[0.2em] text-sm">VOIDFORGED</span>
</div>
<button class="bg-white text-black px-5 py-2 rounded-full text-xs font-bold mono">CONNECT WALLET</button>
</div>
</nav>

<div class="max-w-6xl mx-auto px-6 py-10 grid lg:grid-cols-3 gap-6">
<!-- MAIN -->
<div class="lg:col-span-2">
<h1 class="text-5xl font-bold leading-none mb-3">Stake Your<br><span class="text-zinc-500">Void</span></h1>
<p class="text-zinc-500 mb-10">Stake Voidforged NFTs to earn $VOID rewards.</p>

<div class="grid grid-cols-3 gap-3 mb-8">
<div class="bg-[#111] border border-zinc-800 rounded-2xl p-5"><p class="text-[10px] text-zinc-500 tracking-widest">TOTAL STAKED</p><p class="text-2xl font-bold mono mt-2">1,248</p></div>
<div class="bg-[#111] border border-zinc-800 rounded-2xl p-5"><p class="text-[10px] text-zinc-500 tracking-widest">APR</p><p class="text-2xl font-bold mono mt-2 text-white">86%</p></div>
<div class="bg-[#111] border border-zinc-800 rounded-2xl p-5"><p class="text-[10px] text-zinc-500 tracking-widest">REWARDS</p><p class="text-2xl font-bold mono mt-2">0</p></div>
</div>

<div class="bg-[#111] border border-zinc-800 rounded-2xl p-5">
<p class="text-xs tracking-widest text-zinc-500 mb-4">YOUR VAULT</p>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
<div class="bg-black border border-zinc-800 rounded-xl overflow-hidden"><div class="aspect-square bg-gradient-to-b from-zinc-800 to-black"></div><div class="p-3 flex justify-between items-center"><span class="text-xs mono">#0421</span><span class="text-[10px] bg-white text-black px-2 py-1 rounded font-bold">STAKE</span></div></div>
<div class="bg-black border border-zinc-800 rounded-xl overflow-hidden opacity-60"><div class="aspect-square bg-zinc-900"></div><div class="p-3"><span class="text-xs mono">#0893</span></div></div>
<div class="bg-black border border-zinc-800 rounded-xl overflow-hidden opacity-60"><div class="aspect-square bg-zinc-900"></div><div class="p-3"><span class="text-xs mono">#1102</span></div></div>
<div class="bg-black border border-zinc-800 rounded-xl overflow-hidden opacity-60"><div class="aspect-square bg-zinc-900"></div><div class="p-3"><span class="text-xs mono">#2048</span></div></div>
</div>
</div>
</div>

<!-- SIDE -->
<div class="bg-[#111] border border-zinc-800 rounded-2xl p-6 h-fit">
<p class="text-xs tracking-widest text-zinc-500 mb-6">STAKING STATS</p>
<button class="w-full bg-white text-black py-3.5 rounded-xl font-bold text-sm mb-6">Connect Wallet to Stake</button>
<div class="space-y-3 text-xs mono">
<div class="flex justify-between text-zinc-500"><span>Network</span><span class="text-white">Base</span></div>
<div class="flex justify-between text-zinc-500"><span>Status</span><span class="text-green-400">Live</span></div>
</div>
</div>
</div>
</body>
</html>
