<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOIDFORGED - 5555 on Robinhood Chain 4663</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:monospace;min-height:100vh}
  .topbar{background:#8B5CF6;color:#fff;text-align:center;padding:6px 10px;font-size:10px;letter-spacing:1px;white-space:nowrap;overflow:hidden}
  .header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #151515}
  .logo{font-weight:900;letter-spacing:2px;font-size:12px}
  .wallet-btn{background:#fff;color:#000;padding:6px 14px;border-radius:20px;font-size:11px;border:none;font-weight:bold;cursor:pointer}
  .main{padding:20px;max-width:500px;margin:0 auto}
  .title{font-size:48px;font-weight:900;line-height:0.85;letter-spacing:-1px;margin-top:24px}
  .title span{color:#3a3a3a}
  .desc{color:#888;font-size:12px;margin-top:12px;line-height:1.4}
  .btn-row{margin-top:18px}
  .btn-stake{background:#fff;color:#000;padding:12px 22px;border-radius:30px;font-weight:bold;font-size:12px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn-stake:disabled{background:#151515;color:#666;border:1px solid #222;cursor:not-allowed}
  .req{color:#333;font-size:9px;margin-top:8px}
  .helmet-card{margin-top:24px;background:#000000;border:1px solid #151515;border-radius:20px;overflow:hidden;position:relative;aspect-ratio:1}
  .helmet-card img{width:100%;height:100%;object-fit:cover;display:block;background:#000}
  .mint-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);border:1px solid #2a2a2a;padding:6px 12px;border-radius:20px;font-size:10px;backdrop-filter:blur(10px)}
</style>
</head>
<body>

<div class="topbar">⚒️ PRE-FORGE • FOLLOW TO JOIN WL • ROBINHOOD CHAIN 4663 • 5555 SUPPLY</div>

<div class="header">
  <div class="logo">⬡ VOIDFORGED</div>
  <button id="connectBtn" class="wallet-btn" onclick="connectWallet()">Connect Wallet</button>
</div>

<div class="main">
  <div class="title">VOID<br><span>FORGED</span></div>
  <p class="desc">Forged In the Void, Tempered by Chaos.</p>

  <!-- INI YANG LU MAU - JOIN LIST DIGANTI STAKE NFT -->
  <div class="btn-row">
    <button id="stakeBtn" class="btn-stake" disabled>🔒 STAKE NFT</button>
  </div>
  <p class="req">Required: Follow Twitter + Connect Wallet</p>

  <div class="helmet-card">
    <img src="https://voidforged.vercel.app/helmet.png" alt="helmet">
    <div class="mint-badge">🔒 MINT NOT LIVE</div>
  </div>
</div>

<script>
const CHAIN_ID = 4663;
let account = null;

async function connectWallet(){
  if(!window.ethereum){alert("Install Metamask / Brave Wallet");return}
  try{
    const accounts = await window.ethereum.request({method:"eth_requestAccounts"});
    account = accounts[0];
    document.getElementById("connectBtn").innerText = account.slice(0,6)+"..."+account.slice(-4);
    // cek chain
    const chainId = await window.ethereum.request({method:"eth_chainId"});
    if(parseInt(chainId) !== CHAIN_ID){
      try{
        await window.ethereum.request({
          method:"wallet_switchEthereumChain",
          params:[{chainId:"0x1237"}] // 4663 hex
        });
      }catch(e){
        // add chain if not exist
        await window.ethereum.request({
          method:"wallet_addEthereumChain",
          params:[{chainId:"0x1237", chainName:"Robinhood Chain", rpcUrls:["https://mainnet.rpc.hoodchain.xyz"], nativeCurrency:{name:"HOOD",symbol:"HOOD",decimals:18}, blockExplorerUrls:["https://explorer.hoodchain.xyz"]}]
        });
      }
    }
    // unlock tombol stake text (tetep locked sampe mint live)
    // document.getElementById("stakeBtn").disabled = false;
    // document.getElementById("stakeBtn").innerText = "STAKE NFT →";
  }catch(err){console.log(err)}
}
</script>

</body>
</html>
